services:
  surveyapp:
    build: .
    container_name: surveyapp
    ports:
      - "${SURVEYAPP_PORT}:80" # Maps port on your host to port 80 in the container
    volumes:
      - ./:/var/www/html:cached
      - surveyapp_tmp:/var/www/html/tmp
      - surveyapp_upload:/var/www/html/upload
      - surveyapp_sessions:/var/www/html/sessions
      - surveyapp_runtime:/var/www/html/application/runtime
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - surveyapp_net

  migrate:
    build: .
    container_name: surveyapp-migrate
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/docker-entrypoint.sh"]
    restart: "no"
    networks:
      - surveyapp_net

  mysql:
    image: mysql:8.0
    container_name: surveyapp-mysql
    ports:
    - "3307:3306"
    command:
    - --log-bin-trust-function-creators=1
    - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/metabase_setup.sql:/docker-entrypoint-initdb.d/metabase_setup.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 10s
      retries: 3
    networks:
      - surveyapp_net

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "${METABASE_PORT}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase-db
      MB_DB_CONNECTION_URI: "jdbc:postgresql://metabase-db:5432/${METABASE_DB_NAME}?socketTimeout=0&tcpKeepAlive=true"
      JAVA_OPTS: ${METABASE_JAVA_OPTS}
    depends_on:
      metabase-db:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    # Healthcheck disabled during initial setup to prevent migration interruption
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 300s
    networks:
      - surveyapp_net

  metabase-db:
    image: postgres:13
    container_name: metabase-db
    environment:
      POSTGRES_USER: ${METABASE_DB_USER}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
      POSTGRES_DB: ${METABASE_DB_NAME}
    command: postgres -c statement_timeout=0 -c idle_in_transaction_session_timeout=0
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      retries: 3
    networks:
      - surveyapp_net

volumes:
  surveyapp_data:
  surveyapp_tmp:
  surveyapp_assets:
  surveyapp_upload:
  surveyapp_sessions:
  surveyapp_runtime:
  mysql_data:
  metabase_data:
  metabase_postgres_data:

 
networks:
  surveyapp_net:
    driver: bridge
