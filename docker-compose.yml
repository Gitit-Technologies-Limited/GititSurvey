version: "3.8"

services:
  surveyapp:
    build: .
    container_name: surveyapp
    ports:
      - "8080:80" # Maps port 8080 on your host to port 80 in the container
    volumes:
      - ./:/var/www/html:cached
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=surveyapp
      - DB_USER=surveyapp_user
      - DB_PASSWORD=xdgjwq45-4jg
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: surveyapp
      MYSQL_USER: surveyapp_user
      MYSQL_PASSWORD: xdgjwq45-4jg
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 10s
      retries: 3

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_password
      MB_DB_HOST: metabase-db
      MB_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET:-generate_this_on_first_run}
    depends_on:
      - metabase-db
      - mysql
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  metabase-db:
    image: postgres:13
    container_name: metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase_secure_password
      POSTGRES_DB: metabase
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      retries: 3

volumes:
  surveyapp_data:
  surveyapp_config:
  surveyapp_tmp:
  mysql_data:
  metabase_data:
  metabase_postgres_data:
